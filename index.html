<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>CapSoccer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0d0d0f;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  #canvas-wrap { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }

  .scoreboard {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 12;
    display: flex; align-items: center;
    background: linear-gradient(180deg, rgba(32,23,16,0.74), rgba(17,12,9,0.78));
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 34px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);
    padding: 10px 20px;
  }
  .side { width: 128px; text-align: center; transition: opacity 0.3s ease; }
  .side .team {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase;
    color: rgba(242,236,224,0.5);
  }
  .side .dot { width: 9px; height: 9px; border-radius: 50%; background: #3b86d4; box-shadow: 0 0 10px rgba(59,134,212,0.65); }
  .side.red .dot { background: #dc5a4f; box-shadow: 0 0 10px rgba(220,90,79,0.65); }
  .side .score {
    font-size: 36px; font-weight: 700; line-height: 1.08;
    color: #b6d8ff; font-variant-numeric: tabular-nums;
  }
  .side .score::after { content: "/6"; font-size: 13px; font-weight: 500; color: rgba(242,236,224,0.35); margin-left: 3px; }
  .side.red .score { color: #ffc0b0; }
  .side .score.pop { animation: scorePop 0.32s ease; }
  .caps { display: flex; gap: 5px; justify-content: center; margin-top: 7px; }
  .caps i {
    width: 9px; height: 9px; border-radius: 50%;
    background: rgba(255,255,255,0.12);
    transition: background 0.25s ease, transform 0.25s ease;
  }
  .caps i.alive { background: #3b86d4; box-shadow: inset 0 -1px 2px rgba(0,0,0,0.45); }
  .side.red .caps i.alive { background: #dc5a4f; }

  .center {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    margin: 0 16px; padding: 2px 18px;
    border-left: 1px solid rgba(255,255,255,0.08);
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  .turn { font-size: 13px; color: rgba(242,236,224,0.75); white-space: nowrap; }
  .turn b { font-size: 14px; }
  .turn.is-blue b { color: #b6d8ff; text-shadow: 0 0 14px rgba(96,160,255,0.55); }
  .turn.is-red b { color: #ffc0b0; text-shadow: 0 0 14px rgba(255,120,100,0.55); }
  .flicks { font-size: 11px; letter-spacing: 0.6px; color: rgba(242,236,224,0.42); }
  .flicks b { color: rgba(242,236,224,0.72); }

  /* the side whose turn it is glows; the other dims */
  .scoreboard:has(.turn.is-blue) .side.blue .team { color: rgba(182,216,255,0.95); }
  .scoreboard:has(.turn.is-blue) .side.blue .score { text-shadow: 0 0 26px rgba(96,160,255,0.6); }
  .scoreboard:has(.turn.is-red) .side.red .team { color: rgba(255,192,176,0.95); }
  .scoreboard:has(.turn.is-red) .side.red .score { text-shadow: 0 0 26px rgba(255,120,100,0.6); }
  .scoreboard:has(.turn.is-blue) .side.red { opacity: 0.4; }
  .scoreboard:has(.turn.is-red) .side.blue { opacity: 0.4; }

  @keyframes scorePop {
    0% { transform: scale(1); }
    45% { transform: scale(1.28); }
    100% { transform: scale(1); }
  }

  @media (max-width: 560px) {
    .scoreboard { top: 8px; padding: 8px 10px; transform: translateX(-50%) scale(0.92); }
    .side { width: 92px; }
    .center { margin: 0 6px; padding: 0 8px; }
  }

  #reset-btn, #sound-btn {
    position: fixed; top: 18px;
    background: rgba(20,16,12,0.55);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(6px);
    color: #f2ece0;
    padding: 8px 16px;
    border-radius: 10px;
    font-size: 13px;
    cursor: pointer;
    z-index: 10;
  }
  #reset-btn { right: 18px; }
  #sound-btn { right: 104px; }
  #reset-btn:hover, #sound-btn:hover { background: rgba(35,28,20,0.7); }

  #instructions {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    color: rgba(242,236,224,0.75);
    font-size: 13px;
    text-align: center;
    z-index: 10;
    pointer-events: none;
    transition: opacity 0.3s ease;
    max-width: 420px;
  }

  #result {
    position: fixed; top: 42%; left: 50%;
    transform: translate(-50%, -50%) scale(0.85);
    font-size: 32px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #ffe9c7;
    text-shadow: 0 2px 18px rgba(0,0,0,0.6);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 20;
    text-align: center;
    max-width: 90vw;
  }
  #result.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #result.miss { color: #d8ccc0; font-size: 22px; }

  .modal-overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,8,6,0.6);
    backdrop-filter: blur(3px);
    z-index: 30;
    padding: 16px;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: rgba(24,19,14,0.92);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 28px 32px;
    border-radius: 16px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    color: #f2ece0;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .modal h2 { margin-bottom: 8px; font-size: 22px; letter-spacing: 0.3px; }
  .modal p { font-size: 13px; color: rgba(242,236,224,0.7); margin-bottom: 20px; line-height: 1.5; }
  .modal button {
    display: block; width: 100%; margin-top: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    color: #f2ece0;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
  }
  .modal button:hover { background: rgba(255,255,255,0.15); }
  .modal button.primary { background: #2f74c0; border-color: transparent; }
  .modal button.primary:hover { background: #3b86d4; }
</style>
</head>
<body>

<div id="canvas-wrap"></div>

<div class="scoreboard">
  <div class="side blue">
    <div class="team"><span class="dot"></span>Blue</div>
    <div class="score" id="score-blue">0</div>
    <div class="caps" id="caps-blue"></div>
  </div>
  <div class="center">
    <div class="turn is-blue" id="turn-pill"><b id="turn-name">Blue</b><span id="turn-suffix">&nbsp;to play</span></div>
    <div class="flicks">Flicks <b id="attempts">0</b></div>
  </div>
  <div class="side red">
    <div class="team"><span class="dot"></span>Red</div>
    <div class="score" id="score-red">0</div>
    <div class="caps" id="caps-red"></div>
  </div>
</div>
<button id="reset-btn">Restart</button>
<button id="sound-btn">Sound: On</button>
<div id="instructions">Pick a mode to start</div>
<div id="result"></div>

<div class="modal-overlay" id="mode-overlay">
  <div class="modal">
    <h2>CapSoccer</h2>
    <p>Six caps each, wide paper goals at both ends. Place your formation, then flick caps at the far goal — deflect, block and knock the other side's caps around.</p>
    <button class="primary" id="mode-ai">Vs Computer (AI)</button>
    <button id="mode-pvp">Two players (hot-seat)</button>
  </div>
</div>

<div class="modal-overlay hidden" id="over-overlay">
  <div class="modal">
    <h2 id="over-title"></h2>
    <p id="over-msg"></p>
    <button class="primary" id="over-new">New match</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  // ---------- Config ----------
  const TABLE_W = 8;
  const TABLE_D = 13;
  const CAP_R = 0.34;
  const BLUE_COUNT = 6;
  const RED_COUNT = 6;
  const GOAL_W = 5.0;          // wide goal, matches the sketch (most of the table width)
  const GOAL_DEPTH = 1.7;      // how deep the scoring zone is at each end
  // two-phase friction: fast caps glide, slow caps roll to a stop quickly
  const FAST_FRICTION = 0.981; // speed > 2 u/s: long, powerful glide
  const SLOW_FRICTION = 0.958; // speed < 2 u/s: rolling resistance, snappy stop
  const WALL_RESTITUTION = 0.55;
  const CAP_RESTITUTION = 0.85;
  const MAX_DRAG = 2.8;        // how far you can pull back (world units)
  const POWER_SCALE = 9.2;     // launch speed at 100% pull — reaches ~half the table
  const POWER_CURVE = 1.6;     // > 1: short pulls stay gentle, top end gets explosive
  const SETTLE_SPEED = 0.045;

  // Game flow
  const MAX_TURNS = 20;        // total flicks (both sides) before the match ends on score
  const AI_AIM_DELAY = 900;    // ms between blue's resolve and the AI flick

  const halfW = TABLE_W / 2 - CAP_R;
  const halfD = TABLE_D / 2 - CAP_R;
  const TOP_GOAL_Z_MIN = TABLE_D / 2 - GOAL_DEPTH;      // z > this, |x| < GOAL_W/2 => top goal zone
  const BOTTOM_GOAL_Z_MAX = -TABLE_D / 2 + GOAL_DEPTH;  // z < this, |x| < GOAL_W/2 => bottom goal zone

  let mode = null;            // 'ai' | 'pvp'
  let state = 'mode-select';  // 'mode-select' -> 'placing' -> 'aiming' | 'ai-turn' -> 'resolving' -> 'gameover'
  let placingColor = 'blue';  // whose caps are being placed
  let placedCount = 0;        // caps placed for `placingColor` so far
  let currentPlayer = 'blue'; // who flicks on 'aiming'
  let blueScore = 0, redScore = 0;
  let attempts = 0, turnCount = 0;
  let aiTimer = null;

  const scoreBlueEl = document.getElementById('score-blue');
  const scoreRedEl = document.getElementById('score-red');
  const attemptsEl = document.getElementById('attempts');
  const resultEl = document.getElementById('result');
  const instructionsEl = document.getElementById('instructions');
  const turnPillEl = document.getElementById('turn-pill');
  const turnNameEl = document.getElementById('turn-name');
  const turnSuffixEl = document.getElementById('turn-suffix');
  const modeOverlayEl = document.getElementById('mode-overlay');
  const overOverlayEl = document.getElementById('over-overlay');
  const overTitleEl = document.getElementById('over-title');
  const overMsgEl = document.getElementById('over-msg');

  // ---------- Sound (synthesised WebAudio, no audio files) ----------
  const SFX = {
    ctx: null,
    master: null,
    muted: false,
    last: {},
    buf: null,

    ensure() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = this.muted ? 0 : 0.5;
        this.master.connect(this.ctx.destination);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    },
    unlock() { return this.ensure() != null; },
    toggle() {
      this.muted = !this.muted;
      if (this.ctx) this.master.gain.value = this.muted ? 0 : 0.5;
    },
    noise(seconds) {
      const ctx = this.ensure();
      if (!ctx) return null;
      if (!this.buf) {
        const len = Math.floor(ctx.sampleRate * 0.4);
        this.buf = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = this.buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      }
      return this.buf;
    },
    tick(kind) {
      const now = performance.now();
      if (this.last[kind] && now - this.last[kind] < 40) return true; // throttled
      this.last[kind] = now;
      return false;
    },
    flick(power) {
      const ctx = this.ensure(); if (!ctx || this.muted) return;
      const t = ctx.currentTime;
      const src = ctx.createBufferSource(); src.buffer = this.noise();
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.3;
      bp.frequency.setValueAtTime(280 + power * 420, t);
      bp.frequency.exponentialRampToValueAtTime(60 + power * 260, t + 0.16);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.10 + power * 0.17, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
      src.connect(bp); bp.connect(g); g.connect(this.master);
      src.start(t); src.stop(t + 0.22);
    },
    place() {
      const ctx = this.ensure(); if (!ctx || this.muted) return;
      const t = ctx.currentTime;
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(230, t);
      o.frequency.exponentialRampToValueAtTime(130, t + 0.1);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.09, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.12);
    },
    capHit(strength) {
      const ctx = this.ensure(); if (!ctx || this.muted || this.tick('cap')) return;
      const t = ctx.currentTime;
      const f = 650 + Math.random() * 550;
      const vol = Math.min(0.22, 0.05 + strength * 0.14);
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.1);
      const o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 0.5;
      const g2 = ctx.createGain();
      g2.gain.setValueAtTime(0.0001, t);
      g2.gain.exponentialRampToValueAtTime(vol * 0.5, t + 0.006);
      g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
      o2.connect(g2); g2.connect(this.master); o2.start(t); o2.stop(t + 0.08);
    },
    wallHit() {
      const ctx = this.ensure(); if (!ctx || this.muted || this.tick('wall')) return;
      const t = ctx.currentTime;
      const o = ctx.createOscillator(); o.type = 'sine';
      o.frequency.setValueAtTime(130, t);
      o.frequency.exponentialRampToValueAtTime(70, t + 0.08);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.11, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.1);
    },
    goal() {
      const ctx = this.ensure(); if (!ctx || this.muted) return;
      const t = ctx.currentTime;
      [523.25, 659.25, 783.99].forEach((f, i) => {
        const st = t + i * 0.09;
        const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
        const o2 = ctx.createOscillator(); o.type = 'triangle'; o2.frequency.value = f * 2;
        const g = ctx.createGain(); const g2 = ctx.createGain();
        g.gain.setValueAtTime(0.0001, st);
        g.gain.exponentialRampToValueAtTime(0.13, st + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, st + 0.4);
        g2.gain.value = 0.05;
        o.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.master);
        o.start(st); o.stop(st + 0.45); o2.start(st); o2.stop(st + 0.45);
      });
    },
    ownGoal() {
      const ctx = this.ensure(); if (!ctx || this.muted) return;
      const t = ctx.currentTime;
      [392.0, 311.13, 233.08].forEach((f, i) => {
        const st = t + i * 0.14;
        const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, st);
        g.gain.exponentialRampToValueAtTime(0.07, st + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, st + 0.3);
        o.connect(g); g.connect(this.master); o.start(st); o.stop(st + 0.35);
      });
    },
    end() {
      const ctx = this.ensure(); if (!ctx || this.muted) return;
      const t = ctx.currentTime;
      [392.0, 523.25, 659.25].forEach((f, i) => {
        const st = t + i * 0.12;
        const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, st);
        g.gain.exponentialRampToValueAtTime(0.14, st + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, st + 0.4);
        o.connect(g); g.connect(this.master); o.start(st); o.stop(st + 0.45);
      });
    }
  };

  // ---------- Scene ----------
  const wrap = document.getElementById('canvas-wrap');
  const scene = new THREE.Scene();
  // warm dusk backdrop instead of flat black
  (function makeSky() {
    const c = document.createElement('canvas');
    c.width = 16; c.height = 512;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 0, c.height);
    g.addColorStop(0.0, '#1b1d33');
    g.addColorStop(0.42, '#4a2d45');
    g.addColorStop(0.72, '#c2683f');
    g.addColorStop(1.0, '#2b1610');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, c.width, c.height);
    const tex = new THREE.CanvasTexture(c);
    tex.needsUpdate = true;
    scene.background = tex;
  })();
  scene.fog = new THREE.Fog(0x2a1c15, 18, 42);

  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 11.5, -12.8);
  camera.lookAt(0, 0, 1);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  wrap.appendChild(renderer.domElement);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- Lighting ----------
  scene.add(new THREE.AmbientLight(0xfff2e0, 0.55));
  const key = new THREE.DirectionalLight(0xfff0d8, 0.95);
  key.position.set(-4, 12, -6);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  key.shadow.camera.left = -10;
  key.shadow.camera.right = 10;
  key.shadow.camera.top = 12;
  key.shadow.camera.bottom = -12;
  key.shadow.bias = -0.0025;
  scene.add(key);
  const rim = new THREE.PointLight(0xffcf9e, 0.35, 24);
  rim.position.set(3, 4, 6);
  scene.add(rim);

  // hanging lamps throw warm pools of light around the table
  const lampBulbMat = new THREE.MeshStandardMaterial({ color: 0xfff4e0, roughness: 0.85, emissive: 0xffbd6e, emissiveIntensity: 0.4 });
  [[-3.8, -5.4], [3.8, -5.4], [-3.8, 5.4], [3.8, 5.4]].forEach(([lx, lz]) => {
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.17, 16, 12), lampBulbMat);
    bulb.position.set(lx, 5.3, lz);
    scene.add(bulb);
    const lamp = new THREE.PointLight(0xffc98a, 0.32, 20, 2);
    lamp.position.set(lx, 4.6, lz);
    scene.add(lamp);
  });

  // ---------- Wood table ----------
  function makeWoodTexture() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 832;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#8a5a34';
    ctx.fillRect(0, 0, c.width, c.height);
    for (let i = 0; i < 70; i++) {
      const y = Math.random() * c.height;
      const shade = Math.random() * 30 - 15;
      ctx.strokeStyle = `rgba(${60 + shade},${34 + shade},${16 + shade},${0.15 + Math.random() * 0.2})`;
      ctx.lineWidth = 1 + Math.random() * 2;
      ctx.beginPath();
      let x = 0;
      ctx.moveTo(x, y);
      while (x < c.width) {
        x += 20 + Math.random() * 30;
        ctx.lineTo(x, y + (Math.random() * 10 - 5));
      }
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(30,16,8,0.5)';
    ctx.lineWidth = 3;
    for (let x = 0; x < c.width; x += c.width / 4) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, c.height); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  const tableGeo = new THREE.BoxGeometry(TABLE_W, 0.4, TABLE_D);
  const tableMat = new THREE.MeshStandardMaterial({ map: makeWoodTexture(), roughness: 0.75, metalness: 0.05 });
  const table = new THREE.Mesh(tableGeo, tableMat);
  table.position.y = -0.2;
  table.receiveShadow = true;
  scene.add(table);

  const legMat = new THREE.MeshStandardMaterial({ color: 0x4a2f1a, roughness: 0.8 });
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
    const leg = new THREE.Mesh(new THREE.BoxGeometry(0.3, 3, 0.3), legMat);
    leg.position.set(sx * (TABLE_W / 2 - 0.3), -1.9, sz * (TABLE_D / 2 - 0.5));
    leg.castShadow = true;
    scene.add(leg);
  });

  function makeFloorTexture() {
    const c = document.createElement('canvas'); c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#241b13'; ctx.fillRect(0, 0, 256, 256);
    const plank = 48;
    for (let r = 0; r < 256 / plank; r++) {
      const y = r * plank;
      const shade = 16 + Math.floor(Math.random() * 16);
      ctx.fillStyle = `rgb(${56 + shade},${40 + shade},${27 + shade})`;
      ctx.fillRect(0, y, 256, plank - 3);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      for (let x = (r % 2) * 26; x < 256; x += 51) ctx.fillRect(x, y, 2, plank - 3);
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1;
    for (let r = 1; r <= 256 / plank; r++) {
      ctx.beginPath(); ctx.moveTo(0, r * plank - 3); ctx.lineTo(256, r * plank - 3); ctx.stroke();
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(12, 12);
    return tex;
  }

  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(70, 70),
    new THREE.MeshStandardMaterial({ map: makeFloorTexture(), roughness: 1 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -3.45;
  floor.receiveShadow = true;
  scene.add(floor);

  // warm lamp pools cast onto the floor
  function makeGlowTexture() {
    const c = document.createElement('canvas'); c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(128, 128, 6, 128, 128, 128);
    g.addColorStop(0, 'rgba(255,186,110,0.9)');
    g.addColorStop(0.5, 'rgba(255,150,80,0.35)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(c);
  }
  const glowMat = new THREE.MeshBasicMaterial({ map: makeGlowTexture(), transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false });
  [[-3.8, -5.4], [3.8, -5.4], [-3.8, 5.4], [3.8, 5.4]].forEach(([lx, lz]) => {
    const pool = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), glowMat);
    pool.rotation.x = -Math.PI / 2;
    pool.position.set(lx, -3.42, lz);
    scene.add(pool);
  });

  // low backdrop wall to close the view
  const backWall = new THREE.Mesh(
    new THREE.BoxGeometry(80, 2.4, 1),
    new THREE.MeshStandardMaterial({ color: 0x33251b, roughness: 1 })
  );
  backWall.position.set(0, -2.25, 15);
  backWall.receiveShadow = true;
  scene.add(backWall);

  // ---------- Goals (posts + crossbar + netted sides + paper backboard) ----------
  function makePaperTexture() {
    const c = document.createElement('canvas'); c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0, 0, 256, 256);
    g.addColorStop(0, '#f6efdd');
    g.addColorStop(1, '#e3d6b9');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
    ctx.strokeStyle = 'rgba(140,105,70,0.16)'; ctx.lineWidth = 2;
    for (let x = 24; x < 256; x += 28) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 40, 256); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(160,120,80,0.09)';
    for (let y = 40; y < 256; y += 36) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y - 24); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(140,95,55,0.10)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 128); ctx.lineTo(256, 128); ctx.stroke();
    return new THREE.CanvasTexture(c);
  }

  function makeGoal(zSide) { // zSide: +1 top (Red's goal), -1 bottom (Blue's goal)
    const group = new THREE.Group();
    const zmouth = zSide > 0 ? TOP_GOAL_Z_MIN : BOTTOM_GOAL_Z_MAX;
    const backZ = zSide * (halfD + CAP_R * 0.5 + 0.02);
    const postR = 0.09;
    const barY = 1.22;
    const boardH = 1.5;
    const frameMat = new THREE.MeshStandardMaterial({ color: 0xf3ecd9, roughness: 0.7, metalness: 0.05 });

    for (const side of [-1, 1]) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(postR, postR, barY + 0.25, 20), frameMat);
      post.position.set(side * GOAL_W / 2, (barY + 0.25) / 2 - 0.05, zmouth);
      post.castShadow = true;
      group.add(post);
    }

    const bar = new THREE.Mesh(new THREE.CylinderGeometry(postR, postR, GOAL_W, 20), frameMat);
    bar.rotation.z = Math.PI / 2;
    bar.position.set(0, barY, zmouth);
    bar.castShadow = true;
    group.add(bar);

    const board = new THREE.Mesh(
      new THREE.PlaneGeometry(GOAL_W, boardH, 12, 4),
      new THREE.MeshStandardMaterial({ map: makePaperTexture(), roughness: 0.95, side: THREE.DoubleSide })
    );
    const bp = board.geometry.attributes.position;
    for (let i = 0; i < bp.count; i++) bp.setZ(i, Math.abs(bp.getX(i)) * 0.1);
    board.geometry.computeVertexNormals();
    board.rotation.x = -0.07 * zSide;
    board.position.y = boardH / 2 - 0.2;
    board.position.z = backZ - zSide * 0.06;
    board.castShadow = true;
    board.receiveShadow = true;
    group.add(board);

    const zLo = Math.min(zmouth, backZ);
    const zHi = Math.max(zmouth, backZ);
    const netMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 });
    for (const side of [-1, 1]) {
      const verts = [];
      for (let z = zLo; z <= zHi; z += 0.34) verts.push(side * GOAL_W / 2, 0, z, side * GOAL_W / 2, boardH + 0.05, z);
      for (let y = 0.3; y < boardH; y += 0.28) verts.push(side * GOAL_W / 2, y, zLo, side * GOAL_W / 2, y, zHi);
      const net = new THREE.LineSegments(
        new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(verts, 3)),
        netMat
      );
      group.add(net);
    }

    const mouthLine = new THREE.Mesh(
      new THREE.BoxGeometry(GOAL_W + 0.3, 0.015, 0.07),
      new THREE.MeshStandardMaterial({ color: 0xd8cbb0, roughness: 0.6 })
    );
    mouthLine.position.set(0, 0.012, zmouth);
    mouthLine.receiveShadow = true;
    group.add(mouthLine);

    return group;
  }
  scene.add(makeGoal(1));
  scene.add(makeGoal(-1));

  // faint scoring-zone markers
  function makeZoneMarker(zSide) {
    const mat = new THREE.MeshBasicMaterial({ color: zSide > 0 ? 0xffd79a : 0x9ac6ff, transparent: true, opacity: 0.07 });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(GOAL_W, GOAL_DEPTH), mat);
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set(0, 0.005, zSide * (TABLE_D / 2 - GOAL_DEPTH / 2));
    return mesh;
  }
  scene.add(makeZoneMarker(1));
  scene.add(makeZoneMarker(-1));

  // ---------- Cap factory ----------
  function makeCapMesh(colorHex) {
    const group = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.35, metalness: 0.55 });
    const top = new THREE.Mesh(new THREE.CylinderGeometry(CAP_R, CAP_R, 0.12, 24), bodyMat);
    top.castShadow = true;
    top.receiveShadow = true;
    group.add(top);
    const ridgeMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4, metalness: 0.5 });
    for (let i = 0; i < 18; i++) {
      const a = (i / 18) * Math.PI * 2;
      const ridge = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.13, 0.06), ridgeMat);
      ridge.position.set(Math.cos(a) * CAP_R, 0, Math.sin(a) * CAP_R);
      ridge.rotation.y = a;
      group.add(ridge);
    }
    return group;
  }

  const caps = []; // { mesh, color:'blue'|'red', x, z, vx, vz, removed }

  function addCap(color, x, z) {
    const hex = color === 'blue' ? 0x2f74c0 : 0xc1443c;
    const mesh = makeCapMesh(hex);
    mesh.position.set(x, CAP_R * 0.55, z);
    scene.add(mesh);
    const cap = { mesh, color, x, z, vx: 0, vz: 0, removed: false };
    caps.push(cap);
    return cap;
  }

  function clearCaps() {
    for (const c of caps) scene.remove(c.mesh);
    caps.length = 0;
  }

  function isInGoal(x, z) {
    const inTop = z > TOP_GOAL_Z_MIN && Math.abs(x) < GOAL_W / 2;
    const inBottom = z < BOTTOM_GOAL_Z_MAX && Math.abs(x) < GOAL_W / 2;
    return inTop || inBottom;
  }

  function overlapsExisting(x, z, extra) {
    for (const c of caps) {
      if (c.removed) continue;
      const dx = x - c.x, dz = z - c.z;
      if (Math.sqrt(dx * dx + dz * dz) < CAP_R * 2 + (extra || 0.05)) return true;
    }
    return false;
  }

  function scatterRedCaps() {
    let placed = 0, tries = 0;
    while (placed < RED_COUNT && tries < 400) {
      tries++;
      const x = (Math.random() * 2 - 1) * halfW;
      const z = (Math.random() * 2 - 1) * halfD;
      if (isInGoal(x, z)) continue;
      if (overlapsExisting(x, z, 0.15)) continue;
      addCap('red', x, z);
      placed++;
    }
  }

  // ---------- Aim line ----------
  const aimMat = new THREE.LineBasicMaterial({ color: 0xffd79a });
  const aimGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
  const aimLine = new THREE.Line(aimGeo, aimMat);
  aimLine.visible = false;
  scene.add(aimLine);

  // ---------- Input ----------
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  const tablePlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0.2);

  function getWorldPointFromEvent(evt) {
    const rect = renderer.domElement.getBoundingClientRect();
    const cx = (evt.touches ? evt.touches[0].clientX : evt.clientX);
    const cy = (evt.touches ? evt.touches[0].clientY : evt.clientY);
    mouse.x = ((cx - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((cy - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const pt = new THREE.Vector3();
    raycaster.ray.intersectPlane(tablePlane, pt);
    return pt;
  }

  let isDragging = false;
  let dragCap = null;
  let dragStartWorld = null;

  function findCapNear(pt, color) {
    if (!pt) return null;
    let best = null, bestDist = 0.9;
    for (const c of caps) {
      if (c.removed || c.color !== color) continue;
      const dx = pt.x - c.x, dz = pt.z - c.z;
      const d = Math.sqrt(dx * dx + dz * dz);
      if (d < bestDist) { best = c; bestDist = d; }
    }
    return best;
  }

  // ---------- Game flow helpers ----------
  function setCapPips(color) {
    const el = document.getElementById('caps-' + color);
    if (!el) return;
    el.innerHTML = '';
    const total = color === 'blue' ? BLUE_COUNT : RED_COUNT;
    const alive = countAlive(color);
    const frag = document.createDocumentFragment();
    for (let i = 0; i < total; i++) {
      const p = document.createElement('i');
      if (i < alive) p.classList.add('alive');
      frag.appendChild(p);
    }
    el.appendChild(frag);
  }

  function updateCapPips() {
    setCapPips('blue');
    setCapPips('red');
  }

  function popScore(el) {
    el.classList.remove('pop');
    void el.offsetWidth; // restart the animation
    el.classList.add('pop');
  }

  function updateScoreHUD() {
    if (scoreBlueEl.textContent != blueScore) { scoreBlueEl.textContent = blueScore; popScore(scoreBlueEl); }
    if (scoreRedEl.textContent != redScore) { scoreRedEl.textContent = redScore; popScore(scoreRedEl); }
    updateCapPips();
  }

  function updateTurnUI() {
    if (state === 'mode-select') return;
    const label = currentPlayer === 'blue' ? 'Blue' : (mode === 'ai' ? 'Red (AI)' : 'Red');
    turnNameEl.textContent = label;
    turnPillEl.classList.remove('is-blue', 'is-red');
    turnPillEl.classList.add(currentPlayer === 'blue' ? 'is-blue' : 'is-red');
    if (state === 'placing') turnSuffixEl.textContent = ' to place';
    else if (state === 'aiming' || state === 'ai-turn') turnSuffixEl.textContent = ' to play';
    else turnSuffixEl.textContent = '';
  }

  function showModeSelect() {
    clearTimeout(aiTimer); aiTimer = null;
    state = 'mode-select';
    clearCaps();
    mode = null;
    blueScore = 0; redScore = 0; attempts = 0; turnCount = 0;
    placedCount = 0; placingColor = 'blue';
    attemptsEl.textContent = '0';
    updateScoreHUD();
    instructionsEl.textContent = 'Pick a mode to start';
    modeOverlayEl.classList.remove('hidden');
    overOverlayEl.classList.add('hidden');
    resultEl.className = '';
  }

  function startSetup(chosenMode) {
    mode = chosenMode;
    blueScore = 0; redScore = 0; attempts = 0; turnCount = 0;
    placedCount = 0; placingColor = 'blue'; currentPlayer = 'blue';
    clearCaps();
    updateScoreHUD();
    attemptsEl.textContent = '0';
    modeOverlayEl.classList.add('hidden');
    overOverlayEl.classList.add('hidden');
    state = 'placing';
    updateTurnUI();
    instructionsEl.textContent = `Blue — click empty spots to place your ${BLUE_COUNT} caps`;
  }

  function beginPlay(firstPlayer) {
    currentPlayer = firstPlayer;
    state = 'aiming';
    updateTurnUI();
    instructionsEl.textContent = `${currentPlayer === 'blue' ? 'Blue' : 'Red'}'s turn — drag back on a ${currentPlayer} cap, release to flick.`;
  }

  function showResult(text, isMiss) {
    resultEl.textContent = text;
    resultEl.className = isMiss ? 'miss show' : 'show';
    setTimeout(() => { resultEl.className = isMiss ? 'miss' : ''; }, 1100);
  }

  function countAlive(color) {
    let n = 0;
    for (const c of caps) if (!c.removed && c.color === color) n++;
    return n;
  }

  function winnerByScore() {
    if (blueScore === redScore) return null;
    return blueScore > redScore ? 'blue' : 'red';
  }

  function showGameOver(title, msg) {
    state = 'gameover';
    overTitleEl.textContent = title;
    overMsgEl.textContent = msg;
    overOverlayEl.classList.remove('hidden');
  }

  function endMatch(title, msg) {
    clearTimeout(aiTimer); aiTimer = null;
    SFX.end();
    showGameOver(title, msg);
  }

  // ---------- Placement / flicking ----------
  function onDown(evt) {
    const pt = getWorldPointFromEvent(evt);
    if (!pt) return;

    if (state === 'placing') {
      if (placedCount >= 6) return;
      if (isInGoal(pt.x, pt.z)) return;
      if (Math.abs(pt.x) > halfW || Math.abs(pt.z) > halfD) return;
      if (overlapsExisting(pt.x, pt.z, 0.15)) return;
      addCap(placingColor, pt.x, pt.z);
      placedCount++;
      SFX.place();

      if (placedCount < 6) {
        instructionsEl.textContent = `${placingColor === 'blue' ? 'Blue' : 'Red'} — click empty spots to place your caps (${placedCount}/6)`;
        return;
      }

      // all 6 placed for this color
      if (placingColor === 'blue') {
        if (mode === 'ai') {
          scatterRedCaps();
          beginPlay('blue');
        } else {
          placingColor = 'red';
          placedCount = 0;
          currentPlayer = 'red';
          updateTurnUI();
          instructionsEl.textContent = `Red — click empty spots to place your ${RED_COUNT} caps`;
        }
      } else {
        beginPlay('blue');
      }
      return;
    }

    if (state !== 'aiming') return;
    const cap = findCapNear(pt, currentPlayer);
    if (!cap) return;
    isDragging = true;
    dragCap = cap;
    dragStartWorld = pt.clone();
    aimLine.visible = true;
  }

  function onMove(evt) {
    if (!isDragging || !dragCap) return;
    const pt = getWorldPointFromEvent(evt);
    if (!pt) return;
    let dx = pt.x - dragCap.x;
    let dz = pt.z - dragCap.z;
    const dist = Math.min(Math.sqrt(dx * dx + dz * dz), MAX_DRAG);
    const ang = Math.atan2(dz, dx);
    const clampedX = dragCap.x + Math.cos(ang) * dist;
    const clampedZ = dragCap.z + Math.sin(ang) * dist;

    aimLine.geometry.setFromPoints([
      new THREE.Vector3(dragCap.x, 0.05, dragCap.z),
      new THREE.Vector3(clampedX, 0.05, clampedZ)
    ]);
    aimLine.material.color.setHex(dist > MAX_DRAG * 0.7 ? 0xff8a5c : 0xffd79a);
    dragStartWorld = new THREE.Vector3(clampedX, 0, clampedZ);
  }

  function onUp() {
    aimLine.visible = false;
    if (!isDragging || !dragCap) { isDragging = false; return; }
    isDragging = false;
    const dx = dragCap.x - dragStartWorld.x;
    const dz = dragCap.z - dragStartWorld.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    if (dist > 0.15) {
      const power = Math.min(dist, MAX_DRAG) / MAX_DRAG;
      const boost = Math.pow(power, POWER_CURVE);
      dragCap.vx = (dx / dist) * boost * POWER_SCALE;
      dragCap.vz = (dz / dist) * boost * POWER_SCALE;
      SFX.flick(boost);
      recordsFlick();
      state = 'resolving';
      instructionsEl.textContent = 'Caps settling…';
    }
    dragCap = null;
  }

  function recordsFlick() {
    attempts++;
    turnCount++;
    attemptsEl.textContent = attempts;
  }

  // ---------- AI turn ----------
  function aiCapScore(c) {
    const align = Math.abs(c.x);                        // prefer central columns
    const toGoal = Math.max(0, c.z - BOTTOM_GOAL_Z_MAX); // nearer its scoring (bottom) line is better
    return align * 0.9 + toGoal * 0.12 + Math.random() * 0.3;
  }

  function pickAICap() {
    const reds = caps.filter(c => c.color === 'red' && !c.removed);
    if (!reds.length) return null;
    reds.sort((a, b) => aiCapScore(a) - aiCapScore(b));
    const pickN = Math.random() < 0.25 ? 0 : Math.floor(Math.random() * Math.min(3, reds.length));
    return reds[pickN];
  }

  function launchAI() {
    if (state !== 'ai-turn') return;
    const cap = pickAICap();
    if (!cap) { resolveTurn(); return; }

    // target somewhere near the centre of Blue's (your) goal, with intentional imprecision
    const targetX = (Math.random() * 2 - 1) * 0.8;
    const targetZ = BOTTOM_GOAL_Z_MAX - (0.7 + Math.random() * 0.3);
    const dx = targetX - cap.x;
    const dz = targetZ - cap.z;
    let speed = Math.hypot(dx, dz) * 1.15;              // power scales with distance to the goal
    speed *= 0.9 + Math.random() * 0.3;                 // some power jitter
    speed = Math.max(2.0, Math.min(speed, 6.0));
    const ang = Math.atan2(dz, dx) + (Math.random() - 0.5) * 0.14; // angle jitter
    let vx = Math.cos(ang) * speed;
    let vz = Math.sin(ang) * speed;
    if (vz > -0.4) vz = -(0.4 + Math.abs(vz));          // always toward Blue's goal, never into its own
    cap.vx = vx;
    cap.vz = vz;
    recordsFlick();
    state = 'resolving';
    instructionsEl.textContent = 'Caps settling…';
    resultEl.className = '';
  }

  function beginAITurn() {
    currentPlayer = 'red';
    updateTurnUI();
    state = 'ai-turn';
    instructionsEl.textContent = 'Red (AI) is picking a cap…';
    aiTimer = setTimeout(launchAI, AI_AIM_DELAY);
  }

  // ---------- Turn resolution ----------
  function resolveTurn() {
    let blueScored = false, redScored = false, blueOwn = false, redOwn = false;

    for (const c of caps) {
      if (c.removed) continue;
      const inFar = (c.color === 'blue' && c.z > TOP_GOAL_Z_MIN) ||
                    (c.color === 'red' && c.z < BOTTOM_GOAL_Z_MAX);
      const inOwn = (c.color === 'blue' && c.z < BOTTOM_GOAL_Z_MAX) ||
                    (c.color === 'red' && c.z > TOP_GOAL_Z_MIN);
      if (inFar && Math.abs(c.x) < GOAL_W / 2) {
        c.removed = true;
        scene.remove(c.mesh);
        if (c.color === 'blue') { blueScore++; blueScored = true; }
        else { redScore++; redScored = true; }
      } else if (inOwn && Math.abs(c.x) < GOAL_W / 2) {
        c.removed = true;
        scene.remove(c.mesh);
        if (c.color === 'blue') blueOwn = true;
        else redOwn = true;
      }
    }

    updateScoreHUD();
    if (blueScored) { SFX.goal(); showResult('Blue scores! 🎯', false); }
    else if (redScored) { SFX.goal(); showResult('Red scores! 🎯', false); }
    else if (blueOwn) { SFX.ownGoal(); showResult('Own goal — Blue cap lost', true); }
    else if (redOwn) { SFX.ownGoal(); showResult('Own goal — Red cap lost', true); }

    const blueAlive = countAlive('blue');
    const redAlive = countAlive('red');

    // Out of caps ends the match immediately
    if (blueAlive === 0 || redAlive === 0) {
      if (blueAlive === 0 && redAlive === 0) {
        const w = winnerByScore();
        endMatch(w ? (w === 'blue' ? 'Blue wins!' : 'Red wins!') : 'Draw!',
          `Both sides ran out of caps. Blue ${blueScore} – ${redScore} Red.`);
      } else {
        const loser = blueAlive === 0 ? 'Blue' : 'Red';
        endMatch(`${loser === 'Blue' ? 'Red' : 'Blue'} wins!`,
          `${loser} is out of caps. Blue ${blueScore} – ${redScore} Red.`);
      }
      return;
    }

    // Max turns reached — the score decides
    if (turnCount >= MAX_TURNS) {
      const w = winnerByScore();
      endMatch(w ? (w === 'blue' ? 'Blue wins!' : 'Red wins!') : 'Draw!',
        `Max turns reached. Blue ${blueScore} – ${redScore} Red.`);
      return;
    }

    // Next player's turn
    if (mode === 'ai') {
      if (currentPlayer === 'blue') { beginAITurn(); }
      else { beginPlay('blue'); }
    } else {
      currentPlayer = currentPlayer === 'blue' ? 'red' : 'blue';
      beginPlay(currentPlayer);
    }
  }

  renderer.domElement.addEventListener('mousedown', onDown);
  renderer.domElement.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  renderer.domElement.addEventListener('touchstart', onDown, { passive: true });
  renderer.domElement.addEventListener('touchmove', onMove, { passive: true });
  window.addEventListener('touchend', onUp);

  // ---------- UI wiring ----------
  window.addEventListener('pointerdown', () => SFX.unlock(), { once: true });
  const soundBtnEl = document.getElementById('sound-btn');
  soundBtnEl.addEventListener('click', () => { SFX.toggle(); soundBtnEl.textContent = SFX.muted ? 'Sound: Off' : 'Sound: On'; });
  document.getElementById('reset-btn').addEventListener('click', showModeSelect);
  document.getElementById('over-new').addEventListener('click', showModeSelect);
  document.getElementById('mode-ai').addEventListener('click', () => startSetup('ai'));
  document.getElementById('mode-pvp').addEventListener('click', () => startSetup('pvp'));

  // ---------- Physics ----------
  function physicsStep() {
    if (state !== 'resolving') return;

    for (const c of caps) {
      if (c.removed) continue;
      c.x += c.vx * 0.016;
      c.z += c.vz * 0.016;
      const sp = Math.sqrt(c.vx * c.vx + c.vz * c.vz);
      const fr = sp > 2.0 ? FAST_FRICTION : SLOW_FRICTION;
      c.vx *= fr;
      c.vz *= fr;

      if (c.x > halfW) { c.x = halfW; c.vx *= -WALL_RESTITUTION; SFX.wallHit(); }
      if (c.x < -halfW) { c.x = -halfW; c.vx *= -WALL_RESTITUTION; SFX.wallHit(); }
      if (c.z > halfD) { c.z = halfD; c.vz *= -WALL_RESTITUTION; SFX.wallHit(); }
      if (c.z < -halfD) { c.z = -halfD; c.vz *= -WALL_RESTITUTION; SFX.wallHit(); }

      // once past a goal line, the side nets stop caps sliding out the wide mouth
      if (c.z > TOP_GOAL_Z_MIN) {
        if (c.x > GOAL_W / 2) { c.x = GOAL_W / 2; c.vx *= -0.55; SFX.wallHit(); }
        else if (c.x < -GOAL_W / 2) { c.x = -GOAL_W / 2; c.vx *= -0.55; SFX.wallHit(); }
      }
      if (c.z < BOTTOM_GOAL_Z_MAX) {
        if (c.x > GOAL_W / 2) { c.x = GOAL_W / 2; c.vx *= -0.55; SFX.wallHit(); }
        else if (c.x < -GOAL_W / 2) { c.x = -GOAL_W / 2; c.vx *= -0.55; SFX.wallHit(); }
      }

      const speed = Math.sqrt(c.vx * c.vx + c.vz * c.vz);
      c.mesh.rotation.y += speed * 0.4;
    }

    // pairwise collisions
    for (let i = 0; i < caps.length; i++) {
      const a = caps[i];
      if (a.removed) continue;
      for (let j = i + 1; j < caps.length; j++) {
        const b = caps[j];
        if (b.removed) continue;
        const dx = b.x - a.x, dz = b.z - a.z;
        const dist = Math.sqrt(dx * dx + dz * dz);
        const minDist = CAP_R * 2;
        if (dist > 0.0001 && dist < minDist) {
          const overlap = minDist - dist;
          const nx = dx / dist, nz = dz / dist;
          a.x -= nx * overlap / 2; a.z -= nz * overlap / 2;
          b.x += nx * overlap / 2; b.z += nz * overlap / 2;

          const rvx = b.vx - a.vx, rvz = b.vz - a.vz;
          const velAlongNormal = rvx * nx + rvz * nz;
          if (velAlongNormal < 0) {
            const impulse = -(1 + CAP_RESTITUTION) * velAlongNormal / 2;
            a.vx -= impulse * nx; a.vz -= impulse * nz;
            b.vx += impulse * nx; b.vz += impulse * nz;
            SFX.capHit(Math.min(1, Math.abs(impulse) / 4));
          }
        }
      }
    }

    for (const c of caps) {
      if (c.removed) continue;
      c.mesh.position.x = c.x;
      c.mesh.position.z = c.z;
    }

    const maxSpeed = caps.reduce((m, c) => c.removed ? m : Math.max(m, Math.sqrt(c.vx * c.vx + c.vz * c.vz)), 0);
    if (maxSpeed < SETTLE_SPEED) {
      for (const c of caps) { c.vx = 0; c.vz = 0; }
      resolveTurn();
    }
  }

  // ---------- Render loop ----------
  function animate() {
    requestAnimationFrame(animate);
    physicsStep();
    renderer.render(scene, camera);
  }
  animate();

  // Initial state
  showModeSelect();

  // Minimal debug hooks — only active when requested via the URL query string.
  if (window.__CAPFLICK_DEBUG__) {
    window.__capflick = {
      get state() { return state; },
      get mode() { return mode; },
      get currentPlayer() { return currentPlayer; },
      get placingColor() { return placingColor; },
      get placedCount() { return placedCount; },
      get scores() { return { blue: blueScore, red: redScore }; },
      get turnCount() { return turnCount; },
      caps: caps,
      addCap: addCap,
      resolveTurn: resolveTurn,
      endMatch: endMatch,
      beginPlay: beginPlay,
      launchAI: launchAI,
      recordsFlick: recordsFlick,
      physicsStep: physicsStep,
      settleAll: (maxTicks) => {
        let i = 0;
        while (state === 'resolving' && i++ < (maxTicks || 20000)) physicsStep();
        return state;
      },
      setState: (s) => { state = s; },
      setCurrentPlayer: (p) => { currentPlayer = p; }
    };
  }
})();
</script>
